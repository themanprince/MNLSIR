{% extends 'layout/store_layout.html' %}

{% block conditionalContent %}

    {% if stores %}
            <ul class="list-group list-group-flush">
                {% for store in stores %}
                    <li class="list-group-item">{{ store.store_name }}</li>
                {% endfor %}
            </ul>
    {% else %}
            <div class="py-2 px-3 border-primary border-3">
                No Existing Stores. Please Create a New Store
            </div>
    {% endif %}

{% endblock %}
