{% extends "sqladmin/layout.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Dispatch Stock</h2>
            <p class="text-muted mb-0">
                Record products dispatched to a destination vessel.
            </p>
        </div>
    </div>

    {% if message %}
        <div class="alert alert-{{ message_type or 'info' }}">
            {{ message }}
        </div>
    {% endif %}

    <form method="post" action="/admin/dispatch" id="dispatch-form">
        <div class="card mb-4">
            <div class="card-header">
                <strong>Dispatch Details</strong>
            </div>

            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="store_id" class="form-label">
                            Store
                        </label>

                        <select
                            class="form-select"
                            id="store_id"
                            name="store_id"
                            required
                        >
                            <option value="">Select a store</option>

                            {% for store in stores %}
                                <option value="{{ store.id }}">
                                    {{ store.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="date" class="form-label">
                            Dispatch Date
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="date"
                            name="date"
                            value="{{ today }}"
                            max="{{ today }}"
                            required
                        >
                    </div>

                    <div class="col-md-4">
                        <label for="destination_vessel" class="form-label">
                            Destination Vessel
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="destination_vessel"
                            name="destination_vessel"
                            maxlength="255"
                            required
                        >
                    </div>

                    <div class="col-12">
                        <label for="remarks" class="form-label">
                            Remarks
                        </label>

                        <textarea
                            class="form-control"
                            id="remarks"
                            name="remarks"
                            rows="2"
                            maxlength="2000"
                        ></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between">
                <strong>Dispatch Items</strong>

                <button
                    type="button"
                    class="btn btn-outline-primary btn-sm"
                    id="add-item-button"
                >
                    Add Item
                </button>
            </div>

            <div class="card-body">
                <div id="items-container"></div>

                <div
                    id="empty-items-message"
                    class="alert alert-secondary"
                >
                    Add at least one product.
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end">
            <button
                type="submit"
                class="btn btn-primary"
            >
                Record Dispatch
            </button>
        </div>
    </form>
</div>

<template id="item-row-template">
    <div class="dispatch-item-row border rounded p-3 mb-3">
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label">Product</label>

                <select
                    class="form-select product-select"
                    name="product_id"
                    required
                >
                    <option value="">Select a product</option>

                    {% for product in products %}
                        <option value="{{ product.id }}">
                            {{ product.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Unit</label>

                <select
                    class="form-select unit-select"
                    name="unit_id"
                    required
                    disabled
                >
                    <option value="">
                        Select a product first
                    </option>
                </select>
            </div>

            <div class="col-md-2">
                <label class="form-label">Quantity</label>

                <input
                    type="number"
                    class="form-control"
                    name="quantity"
                    min="0.0001"
                    step="0.0001"
                    required
                >
            </div>

            <div class="col-md-2">
                <button
                    type="button"
                    class="btn btn-outline-danger w-100 remove-item-button"
                >
                    Remove
                </button>
            </div>
        </div>
    </div>
</template>

<script src="{{ url_for('static', path='js/stock-item-form.js') }}"></script>

<script>
    const productUnits = {{ product_units | tojson }};

    new StockItemForm({
        productUnits: productUnits,
        itemsContainerId: "items-container",
        itemTemplateId: "item-row-template",
        addItemButtonId: "add-item-button",
        emptyItemsMessageId: "empty-items-message"
    });
</script>
{% endblock %}
